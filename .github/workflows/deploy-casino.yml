name: 🎰 Deploy Casino para GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - 'casino/frontend/**'
      - '.github/workflows/deploy-casino.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    defaults:
      run:
        working-directory: casino/frontend

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚡ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: casino/frontend/package-lock.json

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🏗️ Build
        run: npm run build
        env:
          CI: true

      - name: ⚙️ Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: casino/frontend/dist

      - name: 🚀 Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
